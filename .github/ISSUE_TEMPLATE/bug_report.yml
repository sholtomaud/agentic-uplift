name: Bug report
description: Report a defect in agentic-uplift checks, proof-lock, CLI, or actions
labels: ['bug']
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste exact CLI `--json` output or workflow run link.
    validations:
      required: true
