name: Agentic Uplift Control Plane
description: >-
  Audit agentic readiness, verify proof-lock integrity, emit agent-queryable
  JSON APIs, and deploy a zero-dep SRE cockpit.
author: Sholto Maud
branding:
  icon: shield
  color: blue

inputs:
  token:
    description: GitHub token for reading repository telemetry.
    default: ${{ github.token }}
  out-dir:
    description: Output directory for the JSON API bundle and static cockpit.
    default: _site
  deploy-pages:
    description: Set to true to upload and deploy the output directory to GitHub Pages.
    default: 'true'
  agent-logins:
    description: Extra comma-separated GitHub logins to attribute as AI agents.
    default: ''
  monthly-agentic-budget:
    description: Optional monthly budget cap for autonomous agent spend.
    default: ''
  monthly-human-budget:
    description: Optional monthly budget (USD) for human maintainer time, shown as the human fuel dial.
    default: ''
  human-hourly-rate:
    description: Optional loaded hourly rate (USD) for people; defaults to 100 or uplift.config.json costs.humanHourlyRate.
    default: ''
  copilot-seats:
    description: Optional number of GitHub Copilot seats to amortize over agent-resolved issues.
    default: ''
  agent-model:
    description: Optional model id used to price agent work when a PR reports no Agent-Usage line.
    default: ''

outputs:
  site-dir:
    description: Directory containing the published JSON APIs, schemas, llms.txt, and cockpit.
    value: ${{ inputs.out-dir }}
  page-url:
    description: Deployed GitHub Pages URL (when deploy-pages is true).
    value: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Generate Agentic Uplift JSON APIs & Cockpit
      shell: bash
      env:
        UPLIFT_TOKEN: ${{ inputs.token }}
        UPLIFT_AGENT_LOGINS: ${{ inputs.agent-logins }}
        MONTHLY_AGENTIC_BUDGET: ${{ inputs.monthly-agentic-budget }}
        MONTHLY_HUMAN_BUDGET: ${{ inputs.monthly-human-budget }}
        HUMAN_HOURLY_RATE: ${{ inputs.human-hourly-rate }}
        COPILOT_SEATS: ${{ inputs.copilot-seats }}
        AGENT_MODEL: ${{ inputs.agent-model }}
      run: |
        node "$GITHUB_ACTION_PATH/src/cli.ts" publish \
          --repo "$GITHUB_WORKSPACE" \
          --out "${{ inputs.out-dir }}" \
          --github

    - name: Upload GitHub Pages Artifact
      id: upload
      if: inputs.deploy-pages == 'true'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ inputs.out-dir }}

    - name: Wait for GitHub Pages Artifact Indexing
      if: inputs.deploy-pages == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
      run: |
        # REST visibility of the uploaded artifact (matched by id when known).
        for i in 1 2 3 4 5 6 7 8; do
          found=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
            | node -e "const d = JSON.parse(require('node:fs').readFileSync(0,'utf8')); const want = process.env.ARTIFACT_ID; const list = Array.isArray(d.artifacts) ? d.artifacts : []; console.log(want ? (list.some((a) => String(a.id) === want) ? 1 : 0) : (d.total_count || 0));" 2>/dev/null || echo 0)
          if [ "$found" -ge 1 ]; then
            echo "Artifact github-pages indexed (artifact_id=${ARTIFACT_ID:-unknown})."
            break
          fi
          echo "Waiting for github-pages artifact index (attempt $i)..."
          sleep 2
        done
        # deploy-pages queries the internal Actions Results service once with no
        # retry; give that backend time to catch up with the REST index.
        sleep 5

    - name: Deploy to GitHub Pages
      id: deploy
      if: inputs.deploy-pages == 'true'
      continue-on-error: true
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

    - name: Wait before retrying GitHub Pages deploy
      if: inputs.deploy-pages == 'true' && steps.deploy.outcome == 'failure'
      shell: bash
      run: |
        echo "First deploy-pages attempt failed; retrying once after 15s..."
        sleep 15

    - name: Retry Deploy to GitHub Pages
      id: deploy-retry
      if: inputs.deploy-pages == 'true' && steps.deploy.outcome == 'failure'
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
